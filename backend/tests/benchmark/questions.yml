    expected_outcome: emotional_deferral
  - bucket: emotional_only
    text: "Tolong dengarkan saya, saya cuma butuh teman curhat."
    expected_outcome: emotional_deferral
  - bucket: emotional_only
    text: "Saya sedang menangis dan bingung harus cerita ke siapa."
    expected_outcome: emotional_deferral
  - bucket: emotional_only
