# Canonical Indonesian response copy.
# Source of truth: docs/ai-answer-engine-specification.md section 10.
#
# These strings must be byte-identical to the matching keys in
# web/app/locales/id.json. tests/test_copy_parity.py asserts that.
#
# Changing any string here is a product change and requires editorial sign-off
# recorded in the PR (AI Spec section 14).

greeting: |-
  Selamat datang. Silakan tanyakan apa pun tentang iman — Allah, Isa Al-Masih, Kitab Suci, atau pertanyaan iman lainnya.

source_note: "Jawaban disusun berdasarkan Kitab Suci."

# F-10 — out of scope (irrelevant)
refusal: |-
  Maaf, saya hanya dapat menjawab pertanyaan seputar iman — tentang Allah, Isa Al-Masih, Kitab Suci, atau pertanyaan iman lainnya.

  Silakan ajukan pertanyaan tentang iman yang ingin Anda ketahui.

# F-29 — retrieval found nothing above threshold (template, not AI)
no_grounding: |-
  Maaf, saya belum memiliki bahan yang cukup untuk menjawab pertanyaan itu dengan baik.

  Pertanyaan Anda sudah kami catat, agar tim kami dapat menyiapkan jawabannya. Sementara itu, Anda boleh bertanya tentang hal lain yang sedang Anda pikirkan.

# F-44 — emotional-only deferral (template, not AI)
# {contact_name} and {contact_number} come from admin system config (F-45).
emotional_deferral: |-
  [PLACEHOLDER — TIDAK BOLEH DIPAKAI DI STAGING/PRODUKSI]

  Terima kasih sudah menyampaikan apa yang Anda rasakan. Hal itu penting.

  Layanan ini menjawab pertanyaan tentang iman dari tulisan yang tersedia, dan tidak membahas topik emosional sebagai bahan jawaban.

  Jika Anda ingin berbicara dengan seseorang, silakan hubungi {contact_name}: {contact_number}.

  Jika nanti Anda punya pertanyaan tentang Allah, Isa Al-Masih, atau Kitab Suci, saya siap membantu dari bahan yang kami miliki.

# F-28 — answer failed validation twice
fallback: |-
  Maaf, saya belum dapat menyusun jawaban yang layak untuk pertanyaan ini. Tim kami akan meninjaunya.

  Silakan coba menanyakannya dengan cara lain, atau tanyakan hal lain.

# F-16 — {minutes} is interpolated by the caller
rate_limit: "Anda telah mencapai batas 30 pertanyaan dalam satu jam. Silakan kembali lagi dalam {minutes} menit."

# F-27
error: "Maaf, terjadi gangguan saat menyiapkan jawaban."

identity: |-
  Saya Tanya Iman, sebuah layanan yang menjawab pertanyaan berdasarkan tulisan dari beberapa situs dialog keagamaan berbahasa Indonesia. Saya bukan manusia, dan saya hanya menjawab dari bahan-bahan tersebut.

input_too_long: "Pertanyaan Anda terlalu panjang. Mohon persingkat menjadi paling banyak 1.000 karakter."

input_empty: "Silakan tulis pertanyaan Anda terlebih dahulu."
